# Проверка на настоящей Windows: зависимости, тесты, Windows API, установщик.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jarvis/**"
      - "scripts/**"
      - "tests/**"
      - "*.bat"
      - "requirements*.txt"
      - "config.toml"
      - ".github/workflows/windows.yml"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости (как у пользователя)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Тесты
        run: python -m pytest -q
      - name: Статический анализ
        run: python -m pyflakes jarvis scripts tests
      - name: Windows API вживую
        run: python scripts/windows_smoke.py
      - name: Проверка компонентов (Ollama и микрофона на машине нет — ошибки ожидаемы)
        run: python -m jarvis --check
        continue-on-error: true
      - name: Диагностический отчёт
        if: always()
        run: python -m jarvis --report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-tests
          path: data/report.txt

  install-bat:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ' '), 'install.bat') ||
      contains(join(github.event.commits.*.modified, ' '), 'requirements')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.bat /auto (без вопросов, код ошибки при сбое)
        shell: cmd
        run: install.bat /auto
      - name: Модели речи действительно скачаны
        shell: cmd
        run: |
          if not exist models\vosk-model-small-ru-0.22\am exit /b 1
          dir /b models\whisper | findstr /i small || exit /b 1
      - name: Окружение, созданное установщиком, работает
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          .venv\Scripts\python.exe -m pytest -q
      - name: Проверка компонентов (Ollama и микрофона нет — ошибки ожидаемы)
        shell: cmd
        run: .venv\Scripts\python.exe -m jarvis --check
        continue-on-error: true
      - name: Модели загружаются (Vosk, Whisper на CPU) и распознают тишину без галлюцинаций
        shell: cmd
        run: >-
          .venv\Scripts\python.exe -c "import numpy as np; from jarvis.config import Config;
          from jarvis.wake_word import VoskWakeWord; from jarvis.speech_recognition import SpeechRecognizer;
          c=Config.load(); w=VoskWakeWord(c.path('wake_word.vosk_model_path'), c.get('wake_word.phrases')); w.load();
          a=SpeechRecognizer('small','cuda',models_dir=c.path('speech_recognition.models_dir')); print('ASR:', a.load());
          t=a.transcribe(np.zeros(32000,np.float32)); print('тишина:', repr(t)); assert t==''"
      - name: Диагностический отчёт
        if: always()
        shell: cmd
        run: .venv\Scripts\python.exe -m jarvis --report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-install
          path: data/report.txt
