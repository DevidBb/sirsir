<!doctype html>
<!-- Сайт услуг как на Tilda: ссылок на товары нет, прайс — блоки «название + цена»; адрес на «Рублёвском шоссе»
     (не цена «2 руб»), акция в шапке, иконка Visa в подвале, og:image — графика в SVG. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Барбершоп «Бритва» — мужские стрижки</title>
<meta property="og:image" content="/img/britva.svg">
<style>
  body { margin: 0; font-family: sans-serif; }
  .hero img { width: 100%; height: auto; display: block; }
  .t-col { display: flex; gap: 24px; }
  .cookie-popup { position: fixed; bottom: 0; left: 0; right: 0; background: #eee; }
</style>
</head>
<body>
<header class="site-header">
  <a href="/"><img src="/img/britva-mark.png" width="120" height="40" alt="Бритва"></a>
  <div class="announcement">Скидка 10% при заказе от 3 000 ₽</div>
</header>
<main>
  <section class="hero"><img src="/img/salon.png" width="1400" height="600" alt="Зал барбершопа"><h1>Стрижки без записи</h1></section>
  <div class="t-section"><div class="t-col">
    <div class="t-card"><div class="t-name">Мужская стрижка</div><div class="t-price">1 800 р.</div></div>
    <div class="t-card"><div class="t-name">Стрижка бороды</div><div class="t-price">от 900 ₽</div></div>
    <div class="t-card"><div class="t-name">Детская стрижка</div><div><span class="js-price">1200</span> <span>руб.</span></div></div>
  </div></div>
  <ul class="contacts"><li class="address">Москва, Горки-2, Рублёвское шоссе</li><li>Каждый день с 10 до 22</li></ul>
</main>
<div class="cookie-popup">Мы используем cookie. Подарок 500 ₽ за отзыв</div>
<footer><img src="/img/visa-logo.png" width="60" height="40" alt="Visa"></footer>
</body>
</html>
