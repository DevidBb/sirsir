# Конфигурация JARVIS. Значения по умолчанию.
# Настройки, изменённые голосом, хранятся в SQLite (memory.db) и перекрывают эти.

[assistant]
name = "Джарвис"
language = "ru"
# Сколько последних реплик (пар вопрос/ответ) передавать в LLM.
max_history_turns = 6
# Сколько секунд после ответа слушать продолжение без повторного «Джарвис».
follow_up_seconds = 8
# Журнал работы для диагностики (ротация по 2 МБ). Звук и тексты разговоров не пишутся.
log_file = "data/jarvis.log"
# В режиме диктовки: сколько секунд тишины завершают диктовку.
dictation_pause_seconds = 30
# Отклик на «Джарвис»: "beep" — короткий сигнал (можно сразу говорить команду),
# "voice" — слово «Слушаю».
wake_feedback = "beep"
# Можно перебить ответ помощника одной из этих фраз.
barge_in = true
interrupt_phrases = ["стоп", "хватит", "замолчи", "джарвис стоп"]

[wake_word]
# "vosk" — локальное распознавание ключевой фразы (русская модель vosk-model-small-ru).
# "text" — без микрофона, для отладки (фраза вводится с клавиатуры).
engine = "vosk"
# Только слова из словаря Vosk. Варианты написания Whisper («Джервис», «Jarvis»)
# распознаются нечётко при вырезании обращения из команды.
phrases = ["джарвис"]
vosk_model_path = "models/vosk-model-small-ru-0.22"

[audio]
sample_rate = 16000
# None/пусто — устройство по умолчанию. Можно указать индекс или часть имени.
input_device = ""
block_ms = 30
# Определение конца речи (энергетический VAD с адаптивным порогом шума).
silence_ms_to_stop = 900
max_command_seconds = 15
no_speech_timeout_seconds = 6
vad_energy_ratio = 3.0
min_speech_ms = 250

[speech_recognition]
model = "small"
# "cuda" или "cpu". При ошибке GPU автоматически используется CPU.
device = "cuda"
compute_type_gpu = "float16"
compute_type_cpu = "int8"
models_dir = "models/whisper"
beam_size = 1

[llm]
# Только localhost. Иные адреса блокируются модулем security.
base_url = "http://127.0.0.1:11434"
model = "qwen3:8b"
temperature = 0.4
# Ограничение длины ответа (токены) и контекста.
num_predict = 220
# Описания ~30 инструментов занимают ~3 тыс. токенов, поэтому 8192 (≈1.2 ГБ VRAM на кэш).
num_ctx = 8192
timeout_seconds = 90
# Сколько держать LLM в видеопамяти после последнего вопроса ("5m", "0" — сразу
# выгружать, "-1" — никогда). Дольше — нет паузы на загрузку перед редкими вопросами,
# но ~6 ГБ VRAM заняты (может мешать играм).
keep_alive = "30m"
# Загружать модель при запуске помощника (в фоне), а не при первом вопросе.
preload = true
# Если Ollama не запущена — запустить «ollama serve» автоматически.
autostart_ollama = true
max_tool_calls_per_turn = 3
# Провайдер модели для сложных запросов (простые команды выполняются без модели):
# "ollama" — локально (по умолчанию), "claude" — Claude Agent SDK, облако Anthropic
# (нужен вход в Claude Code: «claude login», или ANTHROPIC_API_KEY в окружении).
# Можно переключить в интерфейсе: Настройки → Модель.
provider = "ollama"
# Модель Ollama с поддержкой изображений для «посмотри на экран» (пусто — нет;
# например "qwen2.5vl:7b", ~6 ГБ: ollama pull qwen2.5vl:7b). С провайдером claude не нужна.
vision_model = ""

[llm.claude]
# Пусто — модель Claude Code по умолчанию; можно "sonnet", "opus", "haiku" или полный id.
model = "sonnet"
# Сколько шагов (вызовов инструментов) может сделать агент за одну задачу.
max_turns = 16
timeout_seconds = 240
work_dir = "data/agent"
# Поручения агентам: независимые части задачи (сравнить несколько вариантов, изучить несколько
# модулей) Claude может отдать агентам, которые работают параллельно. Агенты только читают:
# «исследователь» — поиск и чтение страниц во временных вкладках, «аналитик файлов» — чтение
# разрешённых папок. Встроенные агенты Claude Code недоступны.
delegate = true
# Модель агентов: пусто — та же, что выше; "haiku" — дешевле и быстрее.
agent_model = ""

[browser]
# Отдельный профиль Джарвиса: личный профиль браузера не используется,
# пароли и cookies из него не читаются.
profile_dir = "data/browser-profile"
# "chromium" — браузер, скачанный Playwright (python -m playwright install chromium);
# "msedge" или "chrome" — установленный в системе браузер (профиль всё равно отдельный).
channel = "chromium"
# Видимое окно. В фоновом режиме поисковики чаще показывают капчу.
headless = false
timeout_ms = 20000
# Порядок поисковиков для «найди в интернете»: duckduckgo, bing.
search_engines = ["duckduckgo", "bing"]

[web]
# Интерфейс HUD: только этот компьютер. Удалённый доступ не поддерживается.
host = "127.0.0.1"
port = 8765
open_browser = true

[tts]
# "pyttsx3" — системные голоса Windows (SAPI5), ничего не скачивает.
# "silero"  — естественный нейросетевой голос (нужны torch и модель ~40 МБ:
#             pip install -r requirements-silero.txt; python scripts/download_models.py --silero).
#             Если Silero недоступен, автоматически используется pyttsx3.
# "auto"    — Silero, если он установлен, иначе pyttsx3.
engine = "auto"
# v5 — лучше интонации и ударения. Если скачана только старая v4_ru.pt, используется она.
silero_model_path = "models/silero/v5_6_ru.pt"
# Голоса Silero: aidar, eugene (мужские), baya, kseniya, xenia (женские).
# Послушать все: voices.bat. Сменить голосом: «смени голос», «голос бая», «женский голос».
silero_speaker = "aidar"
rate = 185
volume = 1.0
# Часть имени голоса; на Windows русский голос обычно "Irina" или "Pavel".
voice_hint = "ru"

[memory]
db_path = "data/memory.db"
max_facts = 200
# Сохранять краткий итог многошаговых задач (запрос → результат), чтобы потом найти его.
# Секреты не сохраняются; просмотр и удаление — вкладка «Память» в HUD.
task_summaries = true

[files]
# Папки, с файлами и проектами в которых Джарвис может работать («изучи проект и найди
# ошибки», «поправь README»). Чтение, список и поиск — сразу; создание и изменение файла —
# только после подтверждения, перед ним в HUD показывается diff. Старая версия файла
# сохраняется в data/file-backups. Файлы с секретами (.env, ключи) не читаются,
# .exe/.bat/.ps1 и подобные не создаются и не меняются. Пусто — работа с файлами выключена.
allowed_dirs = []
# Пример: allowed_dirs = ["~/Documents/Jarvis", "C:/Projects/my-site"]

[schedules]
# Плановые задачи («каждое утро в 9 сделай сводку новостей»): HUD → Расписание или голосом
# (создание — после подтверждения). Задача выполняется без вас, поэтому действия, требующие
# подтверждения (отправка, удаление, изменение файлов, новая плановая задача), в ней
# не выполняются — Джарвис сообщит об этом в итоге. Запуск, пропущенный больше чем
# на час (компьютер был выключен), не выполняется. Журнал запусков — там же, в HUD.
enabled = true

[skills]
# Навыки — повторяемые сценарии: skills/<имя>/SKILL.md (формат Skills Claude: name, description
# и инструкция; плюс triggers — фразы запуска, tools — разрешённые инструменты, max_steps).
# Запуск: фраза из triggers или «навык <имя> …». Навык не даёт новых прав: те же инструменты,
# проверки и подтверждения; скрипты из папки навыка не запускаются. Список — HUD → Настройки.
enabled = true
# Дополнительные папки с навыками (необязательно):
extra_dirs = []

[mcp]
# Внешние MCP-серверы (Model Context Protocol). Каждый запускается как отдельная программа
# на этом компьютере; модель видит только инструменты из allowed_tools, вызов проходит
# через проверки Джарвиса и журнал. Инструменты не из auto_tools — только с подтверждением.
# Сервер сам может ходить в сеть и к файлам: подключайте только те, которым доверяете.
# Секреты не пишите сюда: в env_vars — имена переменных, значения — в файле .env.
# Состояние подключений: HUD → Диагностика, журнал сервера — data/mcp/<имя>.log.
enabled = true

# Пример (раскомментируйте; нужен Node.js):
# [mcp.servers.files]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/Me/Documents/Jarvis"]
# allowed_tools = ["list_directory", "read_text_file", "search_files", "write_file"]
# auto_tools = ["list_directory", "read_text_file", "search_files"]
# timeout_seconds = 60
#
# [mcp.servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
# allowed_tools = ["search_repositories", "get_file_contents"]
# auto_tools = ["search_repositories", "get_file_contents"]

[security]
# Фразы аварийной остановки — обрабатываются до любой другой логики.
emergency_phrases = ["стоп стоп", "аварийная остановка", "джарвис стоп"]
confirm_phrases = ["подтверждаю", "да подтверждаю", "подтвердить"]
cancel_phrases = ["отмена", "отменить", "нет", "не надо"]
confirmation_timeout_seconds = 20
# Защита от повторов и циклов.
duplicate_command_window_seconds = 4
max_actions_per_minute = 12
# Сетевые обращения разрешены только к этим хостам (localhost для Ollama).
allowed_hosts = ["127.0.0.1", "localhost", "::1"]
# Журнал выполненных действий (ротация по 1 МБ, 3 файла).
audit_log = "data/actions.log"

[windows]
# Приложения, которые разрешено запускать. Имя → команда/путь.
[windows.apps]
"блокнот" = "notepad.exe"
"калькулятор" = "calc.exe"
"проводник" = "explorer.exe"
"диспетчер задач" = "taskmgr.exe"
"браузер" = "msedge.exe"

[windows.websites]
# Сайты, которые разрешено открывать в браузере. Имя → URL.
"ютуб" = "https://www.youtube.com"
"гитхаб" = "https://github.com"
"википедия" = "https://ru.wikipedia.org"
"почта" = "https://mail.google.com"

[windows.folders]
# Папки, которые можно открыть голосом («открой загрузки»).
"загрузки" = "~/Downloads"
"документы" = "~/Documents"
"рабочий стол" = "~/Desktop"
"музыка" = "~/Music"
"изображения" = "~/Pictures"
"видео" = "~/Videos"

[windows.launcher]
# «Открой телеграм»: программы, которых нет в [windows.apps], ищутся по ярлыкам
# меню «Пуск» (%ProgramData% и %APPDATA%\Microsoft\Windows\Start Menu\Programs).
# Список ярлыков кэшируется на столько секунд.
cache_seconds = 600
# Схемы адресов, разрешённые в .url-ярлыках (игры Steam/Epic и т.п.).
url_schemes = ["http", "https", "steam", "com.epicgames.launcher", "uplay", "origin2", "battlenet", "ms-settings"]
# Свои каталоги с ярлыками вместо стандартных (обычно не нужно):
# start_menu_dirs = ["C:/Users/Me/Ярлыки"]

[windows.web_search]
# «Загугли …», «найди в интернете …»: google, yandex и др. (см. SEARCH_SITES в app_finder.py).
engine = "google"
# «Включи песню …», «включи музыку …»: youtube, yandex_music или spotify.
music = "youtube"

[windows.search]
# Каталоги, где разрешён поиск файлов. "~" — домашняя папка пользователя.
allowed_dirs = ["~/Documents", "~/Desktop", "~/Downloads", "~/Music", "~/Pictures"]
max_results = 10
max_scanned_files = 20000
